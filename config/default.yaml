app:
  name: JARVIS
  version: "0.1.1"
  debug: true

ai:
  provider: openai   # openai | stub
  model: gpt-4o-mini
  temperature: 0.7
  max_tokens: 1024

memory:
  path: data/jarvis_memory.db

ui:
  theme: dark
  window_width: 1100
  window_height: 720

permissions:
  allow_system_commands: false
  allow_file_access: true
  allow_network: true

stt:
  enabled: true
  engine: google          # google | sphinx | whisper (future)
  language: ru-RU         # ru-RU | en-US
  phrase_time_limit: 8    # max seconds to listen per phrase
  ambient_duration: 0.5   # seconds to adjust for ambient noise

tts:
  enabled: true
  engine: pyttsx3         # pyttsx3 | stub
  voice: auto             # auto | jarvis | male | female (matched by name keywords)
  rate: 175
  volume: 0.9

voice:
  speak_replies: true     # озвучивать ответы ассистента
  wake_word: "джарвис"    # заготовка для continuous mode
  continuous: false       # непрерывное прослушивание (пока off)

vision:
  enabled: false

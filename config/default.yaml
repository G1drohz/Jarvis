app:
  name: JARVIS
  version: "0.3.3"
  debug: false
  language: ru

ai:
  provider: stub
  model: gpt-4o-mini
  temperature: 0.7
  max_tokens: 1024
  ollama_base: http://127.0.0.1:11434
  ollama_model: llama3.2

memory:
  path: data/jarvis_memory.db

ui:
  theme: dark
  window_width: 1200
  window_height: 780
  hud_enabled: true
  start_in_tray: false

permissions:
  allow_system_commands: false
  allow_file_access: true
  allow_network: true
  require_confirm_for:
    - shutdown
    - restart
    - delete_file
    - run_shell

stt:
  enabled: true
  engine: auto
  language: ru-RU
  phrase_time_limit: 8
  ambient_duration: 0.5
  vosk_model_path: ""

tts:
  enabled: true
  engine: auto
  voice: jarvis
  rate: 160
  volume: 0.9

voice:
  speak_replies: true
  wake_word: "джарвис"
  wake_word_en: "jarvis"
  continuous: false
  wake_cooldown_sec: 1.5

vision:
  enabled: true

plugins:
  auto_load: true
  dirs:
    - jarvis/plugins
    - data/plugins

commands:
  store_path: data/commands.json

name: Build Windows Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Embed full UI body
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/G1drohz/Jarvis/ec6a002c20403a5e7fe429c13f04b46266f4c963/jarvis/ui/main_window.py"
          $out = "jarvis/ui/main_window_body.py"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          $text = Get-Content $out -Raw
          $idx = $text.LastIndexOf("def run_ui")
          if ($idx -gt 0) { $text = $text.Substring(0, $idx).TrimEnd() + "`n" }
          Set-Content -Path $out -Value $text -Encoding UTF8
          Write-Host "UI body:" (Get-Item $out).Length

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pyautogui
          pip install pipwin
          pipwin install pyaudio || pip install pyaudio || echo optional

      - name: Generate icon
        run: python packaging/make_icon.py
        continue-on-error: true

      - name: Verify imports
        run: |
          python -c "from jarvis.monitor.system import SystemMonitor; print(SystemMonitor().snapshot())"
          python -c "from jarvis.ui.main_window_body import MainWindow; print(MainWindow)"
          python -c "from jarvis.ui.window_impl import MainWindow; print(MainWindow)"

      - name: Build PyInstaller
        run: python -m PyInstaller packaging/jarvis.spec --noconfirm --clean

      - name: Pack portable ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/JARVIS")) { throw "dist/JARVIS missing" }
          Compress-Archive -Path "dist/JARVIS/*" -DestinationPath "dist/JARVIS-Portable-0.3.5.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          (Get-Content packaging\installer.iss) -replace '0\.3\.\d','0.3.5' | Set-Content packaging\installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: |
            dist/JARVIS-Portable-0.3.5.zip
            dist/installer/JARVIS-Setup-*.exe

      - name: Release v0.3.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.5
          name: JARVIS v0.3.5 — full audit fixes
          body: |
            Full code audit fixes: UI embed in CI, path fixes, collect_submodules, scenario update-save.
            Download JARVIS-Setup-0.3.5.exe and reinstall.
          files: |
            dist/JARVIS-Portable-0.3.5.zip
            dist/installer/JARVIS-Setup-*.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

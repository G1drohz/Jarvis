name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pyautogui
          pip install pipwin
          pipwin install pyaudio || pip install pyaudio || echo "PyAudio optional"

      - name: Generate icon
        run: python packaging/make_icon.py
        continue-on-error: true

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/jarvis.spec --noconfirm --clean

      - name: Pack portable ZIP
        shell: pwsh
        run: |
          $ver = "0.3.0"
          if (-not (Test-Path "dist/JARVIS")) { throw "dist/JARVIS missing" }
          Compress-Archive -Path "dist/JARVIS/*" -DestinationPath "dist/JARVIS-Portable-$ver.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "ISCC.exe not found"
          }

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
          Get-ChildItem dist\installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: |
            dist/JARVIS-Portable-0.3.0.zip
            dist/installer/JARVIS-Setup-0.3.0.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: JARVIS v0.3.0
          body: |
            ## JARVIS v0.3.0

            ### ⭐ Установщик .exe (рекомендуется)

            Скачай **[JARVIS-Setup-0.3.0.exe](https://github.com/G1drohz/Jarvis/releases/download/v0.3.0/JARVIS-Setup-0.3.0.exe)** и запусти.

            - **Python не нужен** — ни для установщика, ни для приложения
            - Все зависимости уже внутри
            - Ярлыки, меню Пуск, опциональный автозапуск

            ### Portable ZIP

            **[JARVIS-Portable-0.3.0.zip](https://github.com/G1drohz/Jarvis/releases/download/v0.3.0/JARVIS-Portable-0.3.0.zip)** → распакуй → `JARVIS.exe`

            ### Голос Джарвиса

            Нейросеть **edge-tts** (Microsoft):
            - RU: `ru-RU-DmitryNeural`
            - EN: `en-GB-RyanNeural` (британский мужской, стиль butler/AI)

            Офлайн-запас: системный SAPI (pyttsx3).

            Для озвучки нужен интернет (edge-tts). Без сети — системный голос.
          files: |
            dist/JARVIS-Portable-0.3.0.zip
            dist/installer/JARVIS-Setup-0.3.0.exe
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

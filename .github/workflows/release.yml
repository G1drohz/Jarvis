name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pyautogui
          pip install pipwin
          pipwin install pyaudio || pip install pyaudio || echo "PyAudio optional"

      - name: Generate icon
        run: python packaging/make_icon.py
        continue-on-error: true

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/jarvis.spec --noconfirm --clean

      - name: Pack portable ZIP
        shell: pwsh
        run: |
          $ver = "0.2.2"
          $out = "dist/JARVIS-Portable-$ver.zip"
          if (-not (Test-Path "dist/JARVIS")) { throw "dist/JARVIS missing" }
          Compress-Archive -Path "dist/JARVIS/*" -DestinationPath $out -Force

      - name: Pack Setup ZIP (auto Python + deps)
        shell: pwsh
        run: |
          $ver = "0.2.2"
          $stage = "$env:TEMP\jarvis-setup-stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item packaging/setup.bat $stage
          Copy-Item packaging/setup.ps1 $stage
          Copy-Item packaging/README-SETUP.txt $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist/JARVIS-Setup-$ver.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: |
            dist/JARVIS-Portable-0.2.2.zip
            dist/JARVIS-Setup-0.2.2.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.2
          name: JARVIS v0.2.2
          body: |
            ## JARVIS v0.2.2 — Windows

            ### Рекомендуется: установщик с авто-Python

            1. Скачай **[JARVIS-Setup-0.2.2.zip](https://github.com/G1drohz/Jarvis/releases/download/v0.2.2/JARVIS-Setup-0.2.2.zip)**
            2. Распакуй
            3. Запусти **setup.bat**

            Установщик сам:
            - найдёт или установит **Python 3.11**
            - скачает JARVIS
            - поставит зависимости (в т.ч. микрофон, если возможно)
            - создаст ярлыки на рабочем столе и в меню Пуск

            ### Portable (без установки Python)

            1. Скачай **[JARVIS-Portable-0.2.2.zip](https://github.com/G1drohz/Jarvis/releases/download/v0.2.2/JARVIS-Portable-0.2.2.zip)**
            2. Распакуй → **JARVIS.exe**

            ### Примечания
            - SmartScreen: «Подробнее» → «Выполнить в любом случае»
            - Удаление (Setup): `%LOCALAPPDATA%\Programs\JARVIS\uninstall.bat`
          files: |
            dist/JARVIS-Portable-0.2.2.zip
            dist/JARVIS-Setup-0.2.2.zip
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

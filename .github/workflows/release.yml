name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pyautogui
          pip install pipwin
          pipwin install pyaudio || pip install pyaudio || echo optional

      - name: Generate icon
        run: python packaging/make_icon.py
        continue-on-error: true

      - name: Verify imports
        run: |
          python -c "from jarvis.monitor.system import SystemMonitor; print(SystemMonitor().snapshot())"
          python -c "from jarvis.ui.main_window_body import MainWindow; print('MainWindow', MainWindow)"
          python -c "from jarvis.ui.window_impl import MainWindow; print('window_impl', MainWindow)"

      - name: Build PyInstaller
        run: python -m PyInstaller packaging/jarvis.spec --noconfirm --clean

      - name: Pack portable ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/JARVIS")) { throw "dist/JARVIS missing" }
          Compress-Archive -Path "dist/JARVIS/*" -DestinationPath "dist/JARVIS-Portable-0.3.5.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          (Get-Content packaging\installer.iss) -replace '0\.3\.\d','0.3.5' | Set-Content packaging\installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
          Get-ChildItem dist\installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: |
            dist/JARVIS-Portable-0.3.5.zip
            dist/installer/JARVIS-Setup-*.exe

      - name: Release v0.3.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.5
          name: JARVIS v0.3.5 — UI in repo, path fixes
          body: |
            ## Полный аудит и фиксы

            - UI вшит в репозиторий
            - Пути data/ работают рядом с exe
            - Сохранение сценария обновляет выбранный
            - collect_submodules для всех jarvis.*

            ### Скачать
            - **JARVIS-Setup-0.3.5.exe**
            - **JARVIS-Portable-0.3.5.zip**

            Удали `%LOCALAPPDATA%\Programs\JARVIS` перед установкой.
          files: |
            dist/JARVIS-Portable-0.3.5.zip
            dist/installer/JARVIS-Setup-*.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

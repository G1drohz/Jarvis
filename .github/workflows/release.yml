name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pyautogui
          pip install pipwin
          pipwin install pyaudio || pip install pyaudio || echo "PyAudio optional"

      - name: Generate icon
        run: python packaging/make_icon.py
        continue-on-error: true

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/jarvis.spec --noconfirm --clean

      - name: Pack portable ZIP
        shell: pwsh
        run: |
          $out = "dist/JARVIS-Portable-0.2.1.zip"
          if (-not (Test-Path "dist/JARVIS")) { throw "dist/JARVIS missing" }
          Compress-Archive -Path "dist/JARVIS/*" -DestinationPath $out -Force

      - name: Pack Setup ZIP (auto Python + deps)
        shell: pwsh
        run: |
          $stage = "$env:TEMP\jarvis-setup-stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item packaging/setup.bat $stage
          Copy-Item packaging/setup.ps1 $stage
          Copy-Item packaging/README-SETUP.txt $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist/JARVIS-Setup-0.2.1.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: |
            dist/JARVIS-Portable-0.2.1.zip
            dist/JARVIS-Setup-0.2.1.zip

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          name: JARVIS v0.2.1
          body: |
            ## JARVIS v0.2.1 — Windows

            ### Вариант 1 — Установщик (Python ставится сам)

            1. Скачай **JARVIS-Setup-0.2.1.zip**
            2. Распакуй
            3. Запусти **setup.bat**

            Установщик:
            - поставит Python 3.11, если его нет (winget или официальный installer)
            - скачает JARVIS
            - установит все зависимости
            - создаст ярлыки на рабочем столе и в меню Пуск

            ### Вариант 2 — Portable (без Python)

            1. Скачай **JARVIS-Portable-0.2.1.zip**
            2. Распакуй
            3. Запусти **JARVIS.exe**

            ### Примечание
            SmartScreen: «Подробнее» → «Выполнить в любом случае».
            Микрофон: разреши доступ при запросе Windows.
          files: |
            dist/JARVIS-Portable-0.2.1.zip
            dist/JARVIS-Setup-0.2.1.zip
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pyautogui
          pip install pipwin
          pipwin install pyaudio || pip install pyaudio || echo optional

      - name: Generate icon
        run: python packaging/make_icon.py
        continue-on-error: true

      - name: Build PyInstaller
        run: python -m PyInstaller packaging/jarvis.spec --noconfirm --clean

      - name: Pack portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/JARVIS/*" -DestinationPath "dist/JARVIS-Portable-0.3.1.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          (Get-Content packaging\installer.iss) -replace '0\.2\.1','0.3.1' -replace '0\.3\.0','0.3.1' | Set-Content packaging\installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: |
            dist/JARVIS-Portable-0.3.1.zip
            dist/installer/JARVIS-Setup-*.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1
          name: JARVIS v0.3.1 — offline Jarvis voice
          body: |
            ## Голос офлайн (ближе к киношному)

            - **Piper** neural TTS без интернета после первой загрузки модели
            - EN: `en_GB-alan-medium` — британский мужской
            - RU: `ru_RU-dmitri-medium` — мужской neural

            Модели (~60 МБ) качаются один раз в `data/tts_models/`.

            ### Скачать
            - **JARVIS-Setup-0.3.1.exe** — установщик (Python не нужен)
            - **JARVIS-Portable-0.3.1.zip** — portable

            > Не является голосом актёра из MCU (права Disney/Marvel).
          files: |
            dist/JARVIS-Portable-0.3.1.zip
            dist/installer/JARVIS-Setup-*.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
